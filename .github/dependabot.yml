version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      spring:
        patterns:
          - "org.springframework*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
