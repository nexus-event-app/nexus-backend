spring.datasource.url=jdbc:h2:mem:nexus-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.jpa.show-sql=false

jwt.secret=test-only-secret-key-with-more-than-thirty-two-bytes
app.upload.dir=${java.io.tmpdir}/nexus-test-uploads

app.import.enabled=false
app.import.seed-defaults=false
