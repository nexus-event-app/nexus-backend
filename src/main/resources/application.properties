spring.application.name=nexus-backend
spring.profiles.default=dev

server.port=8080
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.compression.enabled=true
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.upload.dir=${UPLOAD_DIR:./uploads}
app.moderation.email=${MODERATION_EMAIL:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrador}

app.import.enabled=${IMPORT_ENABLED:true}
app.import.adzuna.app-id=${ADZUNA_APP_ID:}
app.import.adzuna.app-key=${ADZUNA_APP_KEY:}
app.import.check-interval=${IMPORT_CHECK_INTERVAL:PT15M}
app.import.initial-delay=${IMPORT_INITIAL_DELAY:PT1M}
app.import.seed-defaults=${IMPORT_SEED_DEFAULTS:true}
app.import.news-max-age-days=14
app.import.news-max-items-per-run=10
app.import.job-max-age-days=30
app.import.job-ttl-days=30
app.import.job-max-items-per-run=25
app.import.job-purge-after-days=60

app.auth.require-verified-email=${REQUIRE_VERIFIED_EMAIL:true}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Primer Commit <no-reply@localhost>}
app.contact.email=${CONTACT_EMAIL:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
