spring.datasource.url=jdbc:h2:file:./data/nexusdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Las consultas SQL no se imprimen por defecto: llenan la terminal (miles de líneas en cada importación) y la
# ralentizan. Para depurar una consulta, arranca con SHOW_SQL=true.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

logging.level.com.nexus=${LOG_LEVEL:INFO}
