spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

spring.h2.console.enabled=false

# Cookie de sesión: solo existe durante el ida y vuelta a Google. Solo por HTTPS, invisible para JavaScript y Lax,
# que deja pasar la vuelta de Google (una navegación normal) pero no peticiones de otras webs.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.nexus=INFO
logging.level.org.hibernate.SQL=WARN
